<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KPR Rental System - Login</title>

    <link rel="stylesheet" href="./css/Login.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="login-container">

    <div class="login-box">

        <!-- Logo -->
        <div class="logo">
            <i class="fa-solid fa-house"></i>
            <h1>KPR Rental</h1>
            <p>Property Rental System</p>
        </div>


        <h2>Welcome Back</h2>

        <p class="text">
            Login to your account
        </p>


        <form>
            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input 
                type="email"
                placeholder="Email Address"
                required>

            </div>
            <!-- Password -->
            <div class="input-box">

                <i class="fa-solid fa-lock"></i>
                <input 
                type="password"
                placeholder="Password"
                required>

            </div>
            <div class="option">

                <label>
                    <input type="checkbox">
                    Remember me
                </label>


                <a href="#">
                    Forgot Password?
                </a>

            </div>
            <button type="submit">
                <i class="fa-solid fa-right-to-bracket"></i>
                Login

            </button>


        </form>



        <div class="register">

            Don't have an account?

            <a href="#">
                Register
            </a>

        </div>


    </div>

</div>


</body>

</html>
